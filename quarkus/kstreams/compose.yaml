---
services:
  grafana:
    image: ${CONTAINER_REGISTRY:-}grafana/grafana:13.3.1
    volumes:
      - ./etc/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      NO_PROXY: loki,prometheus,tempo
      # [security]
      GF_AUTH_ANONYMOUS_ENABLED: true
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: true
    ports:
      - "127.0.0.1:3000:3000"

  # https://prometheus.io/docs/guides/opentelemetry/
  prometheus:
    image: ${CONTAINER_REGISTRY:-docker.io/}prom/prometheus:v3.16.0
    volumes:
      - ./etc/prometheus:/etc/prometheus:ro
    command:
      - --config.file=/etc/prometheus/config.yml
      - --web.enable-otlp-receiver
    ports:
      - "127.0.0.1:9090:9090"

  tempo:
    image: ${CONTAINER_REGISTRY:-docker.io/}grafana/tempo:3.1.1
    volumes:
      - ./etc/tempo/config.yml:/etc/tempo.yml:ro
    command:
      - -config.file
      - /etc/tempo.yml
    ports: [ ]
    #  - "127.0.0.1:3200:3200"
    #  - "127.0.0.1:4317:4317" # OTLP gRPC
    #  - "127.0.0.1:4318:4318" # OTLP HTTP

  socat:
    image: ${CONTAINER_REGISTRY:-docker.io/}alpine/socat:1.8.1.3
    ports:
      - "127.0.0.1:4317:4317" # OTLP gRPC
    command:
      - -v
      - -d
      - TCP-LISTEN:4317,bind=0.0.0.0,fork
      - TCP:tempo:4317

  kafbat:
    image: ${CONTAINER_REGISTRY:-docker.io/}kafbat/kafka-ui:v1.5.0
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: "true"
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:29092"

  # https://docs.confluent.io/platform/current/installation/docker/config-reference.html
  # https://developer.confluent.io/confluent-tutorials/kafka-on-docker/
  kafka:
    # https://docs.confluent.io/platform/current/release-notes/changelog.html
    image: ${CONTAINER_REGISTRY:-docker.io/}confluentinc/cp-kafka:8.4.1
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # https://docs.confluent.io/platform/current/installation/configuration/broker-configs.html
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_LISTENERS: "PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"
      KAFKA_MESSAGE_MAX_BYTES: 10485760 # 10MB
      # Replace CLUSTER_ID with a unique base64 UUID using "bin/kafka-storage.sh random-uuid"
      # See https://docs.confluent.io/kafka/operations-tools/kafka-tools.html#kafka-storage-sh
      CLUSTER_ID: "iiHp29bDRDyXDukBBU9oGQ"

  service:
    profiles:
      - with-service
    build:
      dockerfile: src/main/docker/Dockerfile.jvm
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
