---
x-image:
  cp-kafka: &cp-kafka ${CONTAINER_REGISTRY:-docker.io/}confluentinc/cp-kafka:8.3.0
  opentelemetry-collector-contrib: &opentelemetry-collector-contrib ${CONTAINER_REGISTRY:-}otel/opentelemetry-collector-contrib:0.157.0

name: otel

services:
  grafana:
    image: ${CONTAINER_REGISTRY:-}grafana/grafana:13.1.2
    volumes:
      - ./etc/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      NO_PROXY: jaeger,tempo
      # [security]
      GF_AUTH_ANONYMOUS_ENABLED: true
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: true
    ports:
      - "127.0.0.1:3000:3000"

  agent:
    image: *opentelemetry-collector-contrib
    volumes:
      - ./etc/otel/config-agent.yml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317" # OTLP collector grpc
      - "127.0.0.1:4318:4318" # OTLP collector http

  collector:
    image: *opentelemetry-collector-contrib
    volumes:
      - ./etc/otel/config.yml:/etc/otelcol-contrib/config.yaml:ro

  jaeger:
    image: jaegertracing/jaeger:2.20.0
    ports: [ ]
    # - "127.0.0.1:16686:16686" # query serve frontend (Jaeger UI)
    environment:
      - LOG_LEVEL=debug

  tempo:
    image: ${CONTAINER_REGISTRY:-}grafana/tempo:2.10.7
    volumes:
      - ./etc/tempo/config.yml:/etc/tempo.yml:ro
    command:
      - -config.file
      - /etc/tempo.yml

  # https://docs.confluent.io/platform/current/installation/docker/config-reference.html
  # https://developer.confluent.io/confluent-tutorials/kafka-on-docker/
  kafka:
    # https://docs.confluent.io/platform/current/release-notes/changelog.html
    image: *cp-kafka
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      # https://docs.confluent.io/platform/current/installation/configuration/broker-configs.html
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_LISTENERS: "PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"
      # Replace CLUSTER_ID with a unique base64 UUID using "bin/kafka-storage.sh random-uuid"
      # See https://docs.confluent.io/kafka/operations-tools/kafka-tools.html#kafka-storage-sh
      # podman compose exec kafka kafka-storage random-uuid
      CLUSTER_ID: "hVNObYG6TrCPdbblYKi1HQ"

  # https://docs.docker.com/compose/how-tos/lifecycle/ are not supported by Podman
  kafka-setup:
    # https://docs.confluent.io/platform/current/release-notes/changelog.html
    image: *cp-kafka
    environment:
      KAFKA_TOPICS: telemetry
    command:
      - /bin/bash
      - -c
      - |
        while ! kafka-topics --bootstrap-server kafka:29092 --list; do
          sleep 1
        done

        for topic in $${KAFKA_TOPICS//,/ }; do
          if ! kafka-topics --bootstrap-server kafka:29092 --list | grep "$${topic}"; then
            kafka-topics --bootstrap-server kafka:29092 --create --topic $${topic}
          fi
        done

  kafbat:
    image: ${CONTAINER_REGISTRY:-}kafbat/kafka-ui:v1.5.0
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: "true"
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:29092"
